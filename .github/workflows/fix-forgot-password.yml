name: Fix forgot password flow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch forgot password flow
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_button = '<button type="button" class="forgot-link">Forgot password?</button>'
          new_button = '<button type="button" class="forgot-link" onclick="handleForgotPassword()">Forgot password?</button>'

          if old_button not in text:
              raise SystemExit("Could not find forgot password button.")

          text = text.replace(old_button, new_button, 1)

          marker = "    // ── FORM HANDLERS ────────────────────────\n"
          insert = r'''    // ── PASSWORD RESET ───────────────────────
    async function handleForgotPassword() {
      const emailInput = document.getElementById('login-email');
      const email = emailInput.value.trim();

      if (!email) {
        emailInput.focus();
        showToast('✉️ Enter your email address first.');
        return;
      }

      if (!emailInput.checkValidity()) {
        emailInput.reportValidity();
        return;
      }

      showToast('Sending password reset email…');

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://kashvisaxenaks-cpu.github.io/Kasa_Vaas/?reset=1'
      });

      if (error) {
        console.error('Kasa Vaas password reset error:', error);
        showToast(`⚠️ ${error.message || 'Could not send the reset email.'}`);
        return;
      }

      showToast('✉️ Reset link sent. Check your email.');
    }

    function showPasswordResetForm() {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const resetForm = document.getElementById('resetPasswordForm');

      loginForm.classList.add('hidden');
      signupForm.classList.add('hidden');
      resetForm.classList.remove('hidden');

      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('tab-signup').classList.remove('active');
      document.getElementById('footer-switch-text').textContent = '';
      document.getElementById('footer-switch-link').textContent = 'Back to sign in →';
      document.getElementById('footer-switch-link').onclick = () => switchTab('login');
    }

    async function handlePasswordReset(e) {
      e.preventDefault();

      const password = document.getElementById('reset-password').value;
      const confirmPassword = document.getElementById('reset-password-confirm').value;
      const btn = document.getElementById('btn-reset-password');

      if (password.length < 8) {
        showToast('⚠️ Password must be at least 8 characters.');
        return;
      }

      if (password !== confirmPassword) {
        showToast('⚠️ The passwords do not match.');
        return;
      }

      btn.textContent = 'Updating password…';
      btn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;

        document.getElementById('resetPasswordForm').reset();
        switchTab('login');
        closeAuth();
        showToast('✦ Password updated. You can sign in now.');
      } catch (error) {
        console.error('Kasa Vaas password update error:', error);
        showToast(`⚠️ ${error.message || 'Could not update your password.'}`);
      } finally {
        btn.textContent = 'Update Password';
        btn.disabled = false;
      }
    }

    function handleRecoveryUrl() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('reset') === '1') {
        openAuth('login');
        showPasswordResetForm();
      }
    }

'''
          if marker not in text:
              raise SystemExit("Could not find form handler marker.")

          text = text.replace(marker, insert + marker, 1)

          auth_marker = '''        <!-- ── SIGNUP FORM ── -->
        <form class="auth-form hidden" id="signupForm" onsubmit="handleSignup(event)">
'''
          reset_form = '''        <!-- ── PASSWORD RESET FORM ── -->
        <form class="auth-form hidden" id="resetPasswordForm" onsubmit="handlePasswordReset(event)">
          <div class="form-group">
            <label for="reset-password">New Password</label>
            <div class="password-wrapper">
              <input type="password" id="reset-password" placeholder="••••••••" required autocomplete="new-password" />
              <button type="button" class="toggle-password" onclick="togglePwd('reset-password', this)" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>
          <div class="form-group">
            <label for="reset-password-confirm">Confirm New Password</label>
            <div class="password-wrapper">
              <input type="password" id="reset-password-confirm" placeholder="••••••••" required autocomplete="new-password" />
              <button type="button" class="toggle-password" onclick="togglePwd('reset-password-confirm', this)" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>
          <button type="submit" class="submit-btn" id="btn-reset-password">Update Password</button>
        </form>

        <!-- ── SIGNUP FORM ── -->
        <form class="auth-form hidden" id="signupForm" onsubmit="handleSignup(event)">
'''
          if auth_marker not in text:
              raise SystemExit("Could not find signup form marker.")

          text = text.replace(auth_marker, reset_form, 1)

          text = text.replace(
              "    let activeTab = 'login';",
              "    let activeTab = 'login';\n",
              1
          )

          text = text.replace(
              "    // ── ROLE SELECTOR ────────────────────────\n",
              "    // ── ROLE SELECTOR ────────────────────────\n",
              1
          )

          # Handle recovery after Supabase establishes the recovery session.
          text = text.replace(
              "        if (event === 'SIGNED_IN') {\n          closeAuth();\n          showToast('✦ Welcome to Kasa Vaas!');\n        }",
              "        if (event === 'PASSWORD_RECOVERY') {\n          openAuth('login');\n          showPasswordResetForm();\n        } else if (event === 'SIGNED_IN') {\n          closeAuth();\n          showToast('✦ Welcome to Kasa Vaas!');\n        }",
              1
          )

          text = text.replace(
              "    // ── TOAST ────────────────────────────────\n",
              "    // ── RECOVERY URL CHECK ──────────────────\n    handleRecoveryUrl();\n\n    // ── TOAST ────────────────────────────────\n",
              1
          )

          path.write_text(text, encoding="utf-8")
          print("index.html patched successfully")
      
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix forgot password flow [skip ci]" || exit 0
          git push
